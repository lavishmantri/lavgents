# Lavgents Full Stack
# App:       http://localhost:4111  (exposed publicly via system Tailscale Funnel)
# Studio:    http://localhost:4112
# Nango:     http://localhost:3003  (local only)
# Start:     ./start.sh

services:
  # ─── Main Application ───────────────────────────────────────────────
  app:
    build:
      context: .
      target: production
    container_name: lavgents-app
    depends_on:
      nango-server:
        condition: service_healthy
    ports:
      - "4111:4111"
    env_file: .env
    environment:
      # Internal Docker hostname for server-to-server Nango API calls
      NANGO_HOST: http://nango-server:3003
      # Public URL for browser-facing Nango Connect UI
      NANGO_SERVER_URL: http://localhost:3003
      NOTES_ROOT: /obsidian
    volumes:
      - ./data:/app/data
      - ~/Obsidian:/obsidian
      # - ~/zig/hiring:/hiring
    restart: unless-stopped
    networks:
      - nango-network

  # ─── Mastra Studio UI ───────────────────────────────────────────────
  studio:
    build:
      context: .
      target: studio
    container_name: lavgents-studio
    depends_on:
      - app
    ports:
      - "4112:4112"
    restart: unless-stopped
    networks:
      - nango-network

  # ─── Nango Infrastructure ───────────────────────────────────────────
  nango-db:
    image: postgres:17-alpine
    container_name: nango-db
    environment:
      POSTGRES_DB: nango
      POSTGRES_USER: nango
      POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD:-nango}
    volumes:
      - nango-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nango"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nango-network

  nango-redis:
    image: redis:7-alpine
    container_name: nango-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - nango-network

  nango-server:
    image: nangohq/nango-server:hosted
    platform: linux/amd64
    container_name: nango-server
    depends_on:
      nango-db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-3003}:${SERVER_PORT:-3003}"
      - "${CONNECT_UI_PORT:-3009}:${CONNECT_UI_PORT:-3009}"
    environment:
      SERVER_PORT: ${SERVER_PORT:-3003}
      NANGO_DB_USER: nango
      NANGO_DB_PASSWORD: ${NANGO_DB_PASSWORD:-nango}
      NANGO_DB_HOST: nango-db
      NANGO_DB_NAME: nango
      RECORDS_DATABASE_URL: postgresql://nango:${NANGO_DB_PASSWORD:-nango}@nango-db:5432/nango
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY:-E3r2AOp5uirYMTRJlw3NTe0HCE1WYnyBpjBjQc7tZ1Y=}
      NANGO_SERVER_URL: ${NANGO_SERVER_URL:-http://localhost:3003}
      NANGO_CALLBACK_URL: ${NANGO_CALLBACK_URL:-http://localhost:3003/oauth/callback}
      # Note: hosted image auto-generates keys in DB; use the generated
      # dev secret key in .env NANGO_SECRET_KEY for the app to authenticate
      NANGO_REDIS_URL: redis://nango-redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CSP_REPORT_ONLY: "true"
      FLAG_AUTH_ENABLED: "false"
      FLAG_SERVE_CONNECT_UI: "true"
      NANGO_PUBLIC_CONNECT_URL: ${NANGO_PUBLIC_CONNECT_URL:-http://localhost:3009}
      NANGO_CONNECT_SESSION_TOKEN_SECRET: "connect-session-secret-for-local-dev"
      NANGO_LOGS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    networks:
      - nango-network

volumes:
  nango-db-data:

networks:
  nango-network:
    driver: bridge
